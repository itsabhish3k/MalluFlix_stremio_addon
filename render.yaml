services:
  - type: web
    name: malluflix-stremio-addon
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /manifest.json
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_ACCESS_TOKEN
        sync: false
